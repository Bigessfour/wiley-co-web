<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <!--
      Early dark-mode detection: runs synchronously before CSS and Blazor load
      so the page never flickers from light to dark on first paint.

      Sets two attributes on <html>:
        data-wiley-theme="dark" | "light"  — consumed by our app.css selectors
        data-bs-theme="dark"   | "light"  — consumed by Bootstrap 5 vars which
                                            Syncfusion Bootstrap5 theme inherits

      A matchMedia listener keeps both attributes in sync if the OS theme
      changes while the app is open (e.g. auto-dark scheduling on macOS/iOS).
    -->
    <script>
      (function () {
        try {
          var mq =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)");
          var theme = mq && mq.matches ? "dark" : "light";
          document.documentElement.setAttribute("data-wiley-theme", theme);
          document.documentElement.setAttribute("data-bs-theme", theme);
          var handleThemeChange = function (e) {
            var t = e.matches ? "dark" : "light";
            document.documentElement.setAttribute("data-wiley-theme", t);
            document.documentElement.setAttribute("data-bs-theme", t);
          };
          if (mq) {
            if (typeof mq.addEventListener === "function") {
              mq.addEventListener("change", handleThemeChange);
            } else if (typeof mq.addListener === "function") {
              mq.addListener(handleThemeChange);
            }
          }
        } catch (ex) {
          /* Non-fatal: theme defaults to light if matchMedia is unavailable */
        }
      })();
    </script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <!--
      Syncfusion 33.x Fluent2 theme (light base) for native Fluent2 look and
      proper dark/light inheritance via data-bs-theme + data-wiley-theme.
      The id enables the theme toggle in MainLayout to swap to fluent2-dark.css
      (and back) for full Syncfusion control surfaces (grids, cards, inputs, charts,
      sidebar, appbar) in both modes. No hard-coded light-only assumptions.
    -->
    <link
      id="syncfusion-theme"
      rel="stylesheet"
      href="_content/Syncfusion.Blazor.Themes/fluent2.css"
    />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="WileyCoWeb.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
  </head>

  <body>
    <div id="app">
      <div
        class="d-flex min-vh-100 align-items-center justify-content-center bg-dark px-3 text-center text-white"
      >
        <div class="w-100" style="max-width: 28rem">
          <div class="d-flex justify-content-center mb-4">
            <div
              class="spinner-border text-primary"
              role="status"
              style="width: 3.5rem; height: 3.5rem; border-width: 0.35rem"
              aria-hidden="true"
            ></div>
          </div>
          <div>
            <div
              class="text-uppercase fw-semibold small text-primary"
              style="letter-spacing: 0.28em"
            >
              Starting client
            </div>
            <div id="wiley-static-boot-headline" class="mt-2 h4 fw-semibold">
              Starting Wiley Widget
            </div>
            <div id="wiley-static-boot-detail" class="mt-3 small text-white-50">
              Downloading the Blazor WebAssembly runtime and Syncfusion modules.
              First load can take several minutes (~100&nbsp;MB compressed).
              Leave this tab open; progress updates below.
            </div>
            <div class="mt-4" aria-live="polite">
              <div class="progress" style="height: 0.55rem">
                <div
                  id="wiley-static-boot-progress"
                  class="progress-bar progress-bar-striped progress-bar-animated"
                  role="progressbar"
                  style="width: 0%"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                ></div>
              </div>
              <div
                id="wiley-static-boot-progress-label"
                class="mt-2 small text-white-50"
              >
                Preparing download…
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="blazor-error-ui" style="display: none" data-nosnippet>
      <div class="blazor-error-message">An unhandled error has occurred.</div>
      <a href="." class="reload">Reload</a>
      <span class="dismiss" title="Dismiss">🗙</span>
    </div>

    <script src="_content/Syncfusion.Blazor.Core/scripts/syncfusion-blazor.min.js"></script>
    <script src="_content/Syncfusion.Blazor.Charts/scripts/sf-chart.min.js"></script>
    <script src="_content/Syncfusion.Blazor.Grid/scripts/sf-grid.min.js"></script>
    <script src="_content/Syncfusion.Blazor.Spreadsheet/scripts/syncfusion-blazor-spreadsheet.min.js"></script>
    <script src="js/workspace-storage.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="js/wiley-wasm-boot.js"></script>
  </body>
</html>
